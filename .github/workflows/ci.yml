name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build release
        run: make clean && make

      - name: Build dev with sanitizers
        run: make dev

      - name: Test
        run: make test

      - name: Static analysis
        run: make analyze
